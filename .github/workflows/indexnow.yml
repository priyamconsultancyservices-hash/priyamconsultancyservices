name: Notify IndexNow (Bing)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Notify IndexNow with sitemap URLs
        run: node scripts/indexnow-notify.js
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
